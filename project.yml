name: Amtracker
options:
  bundleIdPrefix: com.somefamilies
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: TN7Z2D3D5R
    GENERATE_INFOPLIST_FILE: NO
targets:
  Amtracker:
    type: application
    platform: iOS
    sources: [Amtracker, Shared]
    dependencies:
      - target: AmtrackerWidget
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    entitlements:
      path: Amtracker/Amtracker.entitlements
      properties:
        aps-environment: development
    info:
      path: Amtracker/Info.plist
      properties:
        CFBundleDisplayName: Amtracker
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        AMTRACKER_SERVER_URL: $(AMTRACKER_SERVER_URL)
        AMTRACKER_SHARED_SECRET: $(AMTRACKER_SHARED_SECRET)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [amtracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.somefamilies.amtracker
        TARGETED_DEVICE_FAMILY: "1"
  AmtrackerWidget:
    type: app-extension
    platform: iOS
    sources:
      - AmtrackerWidget
      - path: Shared
        excludes: [Resources, RouteGeometry.swift]   # map data is app-only
    info:
      path: AmtrackerWidget/Info.plist
      properties:
        CFBundleDisplayName: Amtracker
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.somefamilies.amtracker.widget
        TARGETED_DEVICE_FAMILY: "1"
  AmtrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AmtrackerTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.somefamilies.amtracker.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Amtracker:
    build:
      targets:
        Amtracker: all
        AmtrackerWidget: all
    test:
      targets: [AmtrackerTests]
